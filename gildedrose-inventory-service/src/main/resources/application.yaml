spring:
  application:
    name: gildedrose-inventory-engine

  config:
    import: "optional:classpath:gilded-rose-item-aging-policy.yaml"

  datasource:
    url: jdbc:h2:mem:gildedrosedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

    hikari:
      auto-commit: false

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: update
      show-sql: true

server:
  port: 8080